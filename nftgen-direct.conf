server {
    listen 7103;
    server_name 3.111.22.56;

    # Disable proxy for the frontend - let it be accessed directly
    location / {
        # Just return a 200 OK status
        return 200 "NFTGen frontend is running on port 7103. Please access it directly.";
    }

    location /api {
        proxy_pass http://localhost:7104;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /ws {
        proxy_pass http://localhost:7105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Direct access to WebSocket server
    location = /ws-server {
        proxy_pass http://localhost:7105/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
