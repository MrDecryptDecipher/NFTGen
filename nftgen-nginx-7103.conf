server {
    listen 7103;
    server_name 3.111.22.56;

    # Frontend application
    location / {
        proxy_pass http://localhost:7103;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-NFTGen-Origin,X-NFTGen-Session' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-NFTGen-Origin,X-NFTGen-Session' always;
    }

    # API server
    location /api {
        proxy_pass http://localhost:7102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-NFTGen-Origin,X-NFTGen-Session' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-NFTGen-Origin,X-NFTGen-Session' always;
    }

    # WebSocket server
    location /ws {
        proxy_pass http://localhost:7101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-NFTGen-Origin,X-NFTGen-Session' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-NFTGen-Origin,X-NFTGen-Session' always;
    }
}
