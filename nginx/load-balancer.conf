# NFTGen Load Balancer Configuration
# This configuration provides load balancing for high availability and scalability

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic HTTP configuration
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

# Define upstream servers for NFTGen API
upstream nftgen_api_backend {
    # Primary API server
    server localhost:7105 weight=3 max_fails=3 fail_timeout=30s;
    
    # Additional API servers for scaling (uncomment when needed)
    # server localhost:7106 weight=2 max_fails=3 fail_timeout=30s;
    # server localhost:7107 weight=2 max_fails=3 fail_timeout=30s;
    
    # Health check and load balancing method
    least_conn;  # Use least connections method
    keepalive 32;  # Keep connections alive
}

# Define upstream servers for NFTGen Frontend
upstream nftgen_frontend_backend {
    # Primary frontend server
    server localhost:7103 weight=3 max_fails=3 fail_timeout=30s;
    
    # Additional frontend servers for scaling (uncomment when needed)
    # server localhost:7108 weight=2 max_fails=3 fail_timeout=30s;
    # server localhost:7109 weight=2 max_fails=3 fail_timeout=30s;
    
    least_conn;
    keepalive 16;
}

# Define upstream servers for NFTGen WebSocket
upstream nftgen_websocket_backend {
    # Primary WebSocket server
    server localhost:7104 weight=3 max_fails=3 fail_timeout=30s;
    
    # Additional WebSocket servers for scaling (uncomment when needed)
    # server localhost:7110 weight=2 max_fails=3 fail_timeout=30s;
    # server localhost:7111 weight=2 max_fails=3 fail_timeout=30s;
    
    ip_hash;  # Use IP hash for WebSocket sticky sessions
    keepalive 8;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=mint_limit:10m rate=1r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 7102;
    server_name 3.111.22.56 nftgen.nija.app;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Connection limits
    limit_conn conn_limit 20;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # API endpoints with load balancing and rate limiting
    location /api/ {
        # Rate limiting for API calls
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://nftgen_api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Add CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-NFTGen-Origin,X-NFTGen-Session' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-NFTGen-Origin,X-NFTGen-Session' always;
    }
    
    # Upload endpoints with stricter rate limiting
    location /api/web3storage/upload {
        limit_req zone=upload_limit burst=5 nodelay;
        
        proxy_pass http://nftgen_api_backend/api/web3storage/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increased timeouts for uploads
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Larger body size for file uploads
        client_max_body_size 50M;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
    
    # Minting endpoints with very strict rate limiting
    location /api/mint/ {
        limit_req zone=mint_limit burst=2 nodelay;
        
        proxy_pass http://nftgen_api_backend/api/mint/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for blockchain operations
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
    
    # WebSocket endpoints with sticky sessions
    location /ws {
        proxy_pass http://nftgen_websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        
        # Disable buffering for real-time communication
        proxy_buffering off;
    }
    
    # Health check endpoint (bypass load balancer for direct health checks)
    location /health {
        proxy_pass http://localhost:7105/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Quick health check timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        access_log off;  # Don't log health checks
    }
    
    # Load balancer status endpoint
    location /lb-status {
        stub_status on;
        access_log off;
        
        # Restrict access to localhost only
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }
    
    # Frontend application with load balancing
    location / {
        proxy_pass http://nftgen_frontend_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Caching for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://nftgen_frontend_backend;
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, immutable";
            expires 1h;
        }
        
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
    
    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    # Security: Hide nginx version
    server_tokens off;
    
    # Logging
    access_log /var/log/nginx/nftgen_access.log;
    error_log /var/log/nginx/nftgen_error.log;
}

