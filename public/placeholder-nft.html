<!DOCTYPE html>
<html>
<head>
  <title>NFT Placeholder</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #2D3748;
      color: #E2E8F0;
      font-family: Arial, sans-serif;
    }
    .placeholder {
      width: 300px;
      height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 10px;
      background-color: #4A5568;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    .text {
      font-size: 16px;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <div class="placeholder">
    <div class="icon">🖼️</div>
    <div class="text">NFT Image Loading...</div>
  </div>
</body>
</html>
